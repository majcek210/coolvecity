services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?}
      DEBUG: ${DEBUG:-false}
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: coolvecity
      DB_USER: coolvecity
      DB_PASSWORD: ${SERVICE_PASSWORD_MARIADB}
      DB_SSL: "false"
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: coolvecity
      MARIADB_USER: coolvecity
      MARIADB_PASSWORD: ${SERVICE_PASSWORD_MARIADB}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mariadb-data:
